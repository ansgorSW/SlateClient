<!DOCTYPE html>
<html lang="de" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SLATE CLIENT | Next-Gen Minecraft Fabric Client</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        slateBg: '#09070f',
                        slateCard: 'rgba(23, 17, 40, 0.65)',
                        slateBorder: 'rgba(157, 78, 221, 0.2)',
                        slateAccent: '#9d4edd',
                        slateGlow: '#c77dff',
                        slateDarkGlow: '#5a189a',
                        minecraftHud: 'rgba(15, 12, 28, 0.85)',
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    boxShadow: {
                        'purple-glow': '0 0 35px -5px rgba(157, 78, 221, 0.45)',
                        'purple-glow-sm': '0 0 15px 0px rgba(157, 78, 221, 0.3)',
                    }
                }
            }
        }
    </script>

    <style>
        body { background-color: #09070f; color: #f1f0f7; overflow-x: hidden; }
        .bg-grid-pattern { background-image: radial-gradient(rgba(157, 78, 221, 0.15) 1px, transparent 1px); background-size: 32px 32px; }
        .glass-panel { background: rgba(20, 15, 36, 0.65); backdrop-filter: blur(16px); border: 1px solid rgba(157, 78, 221, 0.18); }
        .hud-window { background: rgba(14, 11, 24, 0.88); backdrop-filter: blur(20px); border: 1px solid rgba(199, 125, 255, 0.25); box-shadow: 0 10px 40px rgba(0,0,0,0.8), 0 0 25px rgba(157, 78, 221, 0.2); }
    </style>
</head>
<body class="font-sans antialiased relative">

    <!-- HEADER -->
    <header class="fixed top-0 left-0 right-0 z-50 py-4 px-4 sm:px-8">
        <div class="max-w-7xl mx-auto glass-panel rounded-2xl px-5 py-3 flex items-center justify-between shadow-purple-glow-sm">
            <a href="#" class="flex items-center gap-3 group" onclick="handleSlateTextClick(event)">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-slateAccent to-purple-900 flex items-center justify-center text-white shadow-purple-glow">
                    <svg class="w-6 h-6 fill-current text-white" viewBox="0 0 24 24"><path d="M12 3L2 19h20L12 3zm0 4.2L17.5 17h-11L12 7.2z"/></svg>
                </div>
                <div>
                    <span class="font-extrabold text-xl tracking-wider text-white flex items-center gap-2 select-none">
                        SLATE <span class="text-xs px-2 py-0.5 rounded bg-slateAccent/20 text-slateGlow border border-slateAccent/40 font-mono">v0.3.7</span>
                    </span>
                    <span class="text-[10px] text-gray-400 block tracking-widest uppercase font-mono select-none">Fabric 26.3 Client</span>
                </div>
            </a>
            <button onclick="openModal('download-modal')" class="px-4 py-2 rounded-xl bg-slateAccent text-white text-sm font-semibold shadow-purple-glow">Download</button>
        </div>
    </header>

    <!-- HERO -->
    <section class="relative pt-44 pb-20 px-4 text-center max-w-4xl mx-auto">
        <h1 class="text-5xl font-extrabold text-white mb-6">Der Next-Gen Minecraft Client</h1>
        <button onclick="openModal('download-modal')" class="px-8 py-4 rounded-xl bg-gradient-to-r from-slateAccent to-purple-700 text-white font-bold shadow-purple-glow">
            Jetzt Herunterladen
        </button>
    </section>

    <!-- FOOTER -->
    <footer class="py-8 text-center text-xs text-gray-500 border-t border-slateAccent/10">
        <button onclick="triggerAdminModal()" class="hover:text-slateGlow"><i class="fa-solid fa-lock mr-1"></i>Admin</button>
    </footer>

    <!-- DOWNLOAD MODAL -->
    <div id="download-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md hidden opacity-0 transition-opacity duration-300">
        <div class="hud-window rounded-2xl max-w-md w-full p-6 relative border border-slateAccent/40 shadow-purple-glow">
            <button onclick="closeModal('download-modal')" class="absolute top-4 right-4 text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            <div class="text-center mb-6">
                <h3 class="text-xl font-extrabold text-white">Slate Launcher herunterladen</h3>
                <p class="text-xs text-gray-400 mt-1">Wähle dein Betriebssystem aus</p>
            </div>

            <div class="space-y-3">
                <!-- Windows Option: Zeigt nun cleanen Namen statt Link -->
                <a id="download-windows-btn" href="#" download class="p-4 rounded-xl glass-panel border border-slateAccent/40 hover:border-slateGlow flex items-center justify-between group transition-all bg-slateAccent/10">
                    <div class="flex items-center gap-3">
                        <i class="fa-brands fa-windows text-2xl text-blue-400"></i>
                        <div class="text-left">
                            <div class="text-sm font-bold text-white flex items-center gap-2">
                                <span>Windows</span>
                                <span class="px-2 py-0.2 rounded bg-emerald-500/20 text-emerald-300 text-[10px] font-mono">EMPFOHLEN</span>
                            </div>
                            <div class="text-[11px] text-slateGlow font-mono mt-0.5" id="windows-name-display">Slate-Launcher-Installer.exe</div>
                        </div>
                    </div>
                    <i class="fa-solid fa-arrow-down-long text-slateGlow"></i>
                </a>

                <div class="p-4 rounded-xl glass-panel border border-white/5 opacity-50 flex items-center justify-between cursor-not-allowed">
                    <div class="flex items-center gap-3">
                        <i class="fa-brands fa-linux text-2xl text-gray-400"></i>
                        <div class="text-left">
                            <div class="text-sm font-bold text-gray-300">Linux</div>
                            <div class="text-[11px] text-gray-500 font-mono">Demnächst verfügbar</div>
                        </div>
                    </div>
                    <i class="fa-solid fa-lock text-gray-500 text-sm"></i>
                </div>
            </div>
        </div>
    </div>

    <!-- SECRET ADMIN LOGIN MODAL -->
    <div id="admin-login-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85 backdrop-blur-md hidden opacity-0 transition-opacity duration-300">
        <div class="hud-window rounded-2xl max-w-sm w-full p-6 relative border border-slateAccent/40">
            <button onclick="closeModal('admin-login-modal')" class="absolute top-4 right-4 text-gray-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            <h3 class="text-lg font-bold text-white mb-2">Admin Login</h3>
            <form onsubmit="submitAdminLogin(event)" class="space-y-4">
                <input type="password" id="admin-pw-input" placeholder="Passwort (Standard: GHG)" class="w-full px-3 py-2 rounded-xl bg-slateBg border border-slateAccent/30 text-white text-sm outline-none font-mono">
                <button type="submit" class="w-full py-2.5 rounded-xl bg-slateAccent text-white font-bold text-sm">Anmelden</button>
            </form>
        </div>
    </div>

    <!-- ADMIN PANEL MODAL -->
    <div id="admin-panel-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/90 backdrop-blur-md hidden opacity-0 transition-opacity duration-300">
        <div class="hud-window rounded-2xl max-w-lg w-full p-6 relative border border-slateGlow">
            <button onclick="closeModal('admin-panel-modal')" class="absolute top-4 right-4 text-gray-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            <h3 class="text-lg font-bold text-white mb-4">Admin Control Center</h3>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-white mb-1">Download Link (URL)</label>
                    <input type="text" id="admin-win-url" placeholder="https://..." class="w-full px-3.5 py-2 rounded-xl bg-slateBg border border-slateAccent/30 text-white text-xs font-mono outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-white mb-1">Anzuzeigender Dateiname / Name</label>
                    <input type="text" id="admin-win-name" placeholder="Slate-Launcher-Installer.exe" class="w-full px-3.5 py-2 rounded-xl bg-slateBg border border-slateAccent/30 text-white text-xs font-mono outline-none">
                </div>
                <button onclick="saveAdminSettings()" class="w-full py-2.5 rounded-xl bg-emerald-600 text-white font-bold text-xs">Speichern</button>
            </div>
        </div>
    </div>

    <script>
        const DEFAULT_WIN_URL = "#";
        const DEFAULT_WIN_NAME = "Slate-Launcher-Installer.exe";
        const DEFAULT_ADMIN_PW = "GHG";

        function getVal(key, def) { return localStorage.getItem(key) || def; }

        function initDynamicLinks() {
            document.getElementById('download-windows-btn').setAttribute('href', getVal('slate_win_url', DEFAULT_WIN_URL));
            document.getElementById('windows-name-display').innerText = getVal('slate_win_name', DEFAULT_WIN_NAME);
        }

        let clicks = 0, timer = null;
        function handleSlateTextClick(e) {
            e.preventDefault();
            clicks++;
            if (clicks === 1) timer = setTimeout(() => { clicks = 0; }, 3000);
            if (clicks >= 5) { clearTimeout(timer); clicks = 0; openModal('admin-login-modal'); }
        }

        function triggerAdminModal() { openModal('admin-login-modal'); }

        function submitAdminLogin(e) {
            e.preventDefault();
            if (document.getElementById('admin-pw-input').value === getVal('slate_admin_pw', DEFAULT_ADMIN_PW)) {
                closeModal('admin-login-modal');
                document.getElementById('admin-win-url').value = getVal('slate_win_url', DEFAULT_WIN_URL);
                document.getElementById('admin-win-name').value = getVal('slate_win_name', DEFAULT_WIN_NAME);
                openModal('admin-panel-modal');
            } else {
                alert('Falsches Passwort!');
            }
        }

        function saveAdminSettings() {
            localStorage.setItem('slate_win_url', document.getElementById('admin-win-url').value.trim());
            localStorage.setItem('slate_win_name', document.getElementById('admin-win-name').value.trim());
            initDynamicLinks();
            alert('Gespeichert!');
            closeModal('admin-panel-modal');
        }

        function toggleMobileMenu() { document.getElementById('mobile-menu').classList.toggle('hidden'); }
        function openModal(id) { const m = document.getElementById(id); m.classList.remove('hidden'); setTimeout(() => m.classList.remove('opacity-0'), 10); }
        function closeModal(id) { const m = document.getElementById(id); m.classList.add('opacity-0'); setTimeout(() => m.classList.add('hidden'), 300); }

        window.addEventListener('DOMContentLoaded', initDynamicLinks);
    </script>
</body>
</html>
